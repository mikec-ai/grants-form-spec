name: Portable form proof package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build proof package
        run: python3 scripts/build_proof_package.py

      - name: Publish proof package
        uses: actions/upload-artifact@v4
        with:
          name: portable-form-proof-package-${{ github.sha }}
          path: build/proof-package/
          if-no-files-found: error
