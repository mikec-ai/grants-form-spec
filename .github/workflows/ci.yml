name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  form-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install exact-XSD validation dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxml2-utils

      - run: npm ci
      - run: npm run build
      - run: npm run emit
      - run: npm run project-evidence
      - run: npm run validate-artifacts
      - run: npm test
      - run: npm run test-python
      - run: npm run package-artifacts
      - run: python3 scripts/package_artifacts.py --verify build/grants-form-artifacts.tar.gz
      - name: Generate form analysis
        run: python3 scripts/analyze.py --output-dir build/analysis --json > /dev/null

      - name: Prevent new unclassified form-field debt
        run: npm run check-unclassified

      - name: Check that every TypeSpec file compiles independently
        shell: bash
        run: |
          result=0
          while IFS= read -r -d '' file; do
            if ! npx tsp compile "$file" --no-emit >/dev/null 2>&1; then
              echo "::error file=$file::does not compile independently"
              npx tsp compile "$file" --no-emit 2>&1 | sed -n '/error/,+3p'
              result=1
            fi
          done < <(find typespec-form-spec/lib specs -name '*.tsp' -print0)
          exit "$result"

      - name: Publish portable form artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grants-form-artifacts-${{ github.sha }}
          path: |
            build/grants-form-artifacts.tar.gz
            build/grants-form-artifacts.tar.gz.sha256
            build/analysis/
          if-no-files-found: error
